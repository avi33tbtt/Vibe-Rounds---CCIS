name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Run the demo from a clean checkout
        run: |
          npm run demo -- run --envelope ccis/fixtures/snake/emr-export/emr-demo-case.envelope.json --out "$RUNNER_TEMP/demo-record.json" --at 2026-11-24T12:00:00Z --demo-parameters
          grep -q '"status":"completed"' "$RUNNER_TEMP/demo-record.json"
